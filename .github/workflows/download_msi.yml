name: download MSI

on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create local directory
        run: mkdir -p ./downloaded-files
        
      - name: Download file using GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.SENTHIL_PAT }}
        run: |
          gh api repos/sentara-health/837_IB_POST_ADDIN/Compiled Objects for Deployment/VPHP.DMAS.HIPAA5010834I.Post.Setup.msi \
            -H "Accept: application/vnd.github.v3.raw" \
            --field ref=c5770a6 > downloaded-files/VPHP.DMAS.HIPAA5010834I.Post.Setup.msi
            
      - name: Upload msi as artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPHP.DMAS.HIPAA5010834I.Post.Setup.msi
          path: ./downloaded-files/VPHP.DMAS.HIPAA5010834I.Post.Setup.msi
  deploy:
      runs-on: self-hosted
      needs: [build]
      steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          path: C:\AzureDevops\DeploymentTest
