name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:

    runs-on: self-hosted
    defaults:
      run:
        working-directory: Final_code/Project1
    steps:
      - name: Checkout Remote Repository
        uses: actions/checkout@v4
        with:
          repository: dillhoffuta/assignment-5-AadhityaKumar  # Replace with the target owner and repo
          ref: main                    # Optional: specify a branch, tag, or SHA
          token: ${{ secrets.PAT }}     # Required for private repositories
          path: ./remote-repo-priv
